<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MsgHealth Demo Film</title>
<style>
  @font-face { font-family: 'Nunito'; font-weight: 400; src: url(assets/fonts/nunito-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Nunito'; font-weight: 700; src: url(assets/fonts/nunito-latin-700-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Nunito'; font-weight: 800; src: url(assets/fonts/nunito-latin-800-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Nunito'; font-weight: 900; src: url(assets/fonts/nunito-latin-900-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Fraunces'; font-weight: 600; src: url(assets/fonts/fraunces-latin-600-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Fraunces'; font-weight: 700; src: url(assets/fonts/fraunces-latin-700-normal.woff2) format('woff2'); }
  :root { --bg: #0b0906; --fg: #f3ece0; --muted: #a79d8e; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: Nunito, system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; box-sizing: border-box; }
  canvas { width: min(100%, calc((100vh - 90px) * 16 / 9)); aspect-ratio: 16 / 9; display: block; border-radius: 6px; background: #000; }
  .bar { width: min(100%, calc((100vh - 90px) * 16 / 9)); display: flex; gap: 12px; align-items: center; }
  button { background: #1f1a14; color: var(--fg); border: 1px solid #3a3128; border-radius: 6px; padding: 6px 14px; font: 700 14px Nunito, sans-serif; cursor: pointer; }
  input[type=range] { flex: 1; accent-color: #16a594; }
  #time { font: 700 13px Nunito, sans-serif; color: var(--muted); min-width: 92px; text-align: right; }
  body.render { padding: 0; display: block; }
  body.render canvas { width: 1920px; height: 1080px; border-radius: 0; }
  body.render .bar { display: none; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div class="bar">
  <button id="play">Play</button>
  <input id="seek" type="range" min="0" max="1000" value="0">
  <span id="time">0.0s</span>
</div>
<script src="src/brand.js"></script>
<script src="src/clay.js"></script>
<script src="src/characters.js"></script>
<script src="src/sets.js"></script>
<script src="src/app.js"></script>
<script src="src/scenes.js"></script>
<script src="src/main.js"></script>
</body>
</html>
