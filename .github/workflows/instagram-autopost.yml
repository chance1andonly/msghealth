# Posts the next reel from posting/queue to Instagram 3 times a day. GitHub's own hourly cron never fired, so a
# scheduled Claude task starts this workflow (action=post) at 8am, 12pm and 8pm Eastern. Every Monday it re-picks the best
# hours from your own reels' views, runs the niche research report and refreshes the Instagram token.
name: Instagram autopost

on:
  schedule:
    - cron: '37 5 * * *'     # every night ~12:37am Eastern: niche research, ready before the 2:17am reel batch
    - cron: '23 9 * * 1'     # Mondays: re-pick the best hours, niche research, refresh the token
  workflow_dispatch:
    inputs:
      action:
        description: 'check = test connection · post = post the next reel now · due = post only if a slot is due · optimize = re-pick best hours · research = niche outlier report · refresh = refresh token'
        type: choice
        options: [check, post, due, optimize, research, refresh]
        default: check

permissions:
  contents: write

concurrency:
  group: instagram-autopost
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      FB_TOKEN: ${{ secrets.FB_TOKEN || secrets.IG_TOKEN }}
      FB_APP_ID: ${{ secrets.FB_APP_ID }}
      FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      PUBLIC_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Nightly niche research
        if: github.event_name == 'schedule' && github.event.schedule == '37 5 * * *'
        run: |
          if [ -n "$YOUTUBE_API_KEY" ]; then node posting/research.mjs || echo "::warning::Research failed"; else echo "No YOUTUBE_API_KEY, skipping (Instagram research needs Meta app review)."; fi

      - name: Weekly tune-up
        if: github.event_name == 'schedule' && github.event.schedule == '23 9 * * 1'
        run: |
          node posting/ig.mjs optimize
          if [ -n "$FB_TOKEN" ]; then node posting/research.mjs || echo "::warning::Research failed"; fi
          NEW_TOKEN_FILE=/tmp/ig_token node posting/ig.mjs refresh || echo "::warning::Token refresh failed"

      - name: Manual run
        if: github.event_name == 'workflow_dispatch'
        run: |
          case "${{ inputs.action }}" in
            post) node posting/ig.mjs post --force ;;
            due) node posting/ig.mjs post ;;
            research) node posting/research.mjs ;;
            refresh) NEW_TOKEN_FILE=/tmp/ig_token node posting/ig.mjs refresh ;;
            *) node posting/ig.mjs ${{ inputs.action }} ;;
          esac

      - name: Save the refreshed token
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -s /tmp/ig_token ]; then
            if [ -n "$GH_TOKEN" ]; then gh secret set IG_TOKEN --repo "${{ github.repository }}" < /tmp/ig_token && echo "Saved the refreshed token."
            else echo "::warning::No GH_PAT secret, so the refreshed token was not saved. Generate a new IG_TOKEN before day 60."; fi
            rm -f /tmp/ig_token
          fi

      - name: Save queue, log and schedule
        if: always()
        run: |
          git config user.name "instagram-autopost"
          git config user.email "actions@users.noreply.github.com"
          git add -A posting
          git diff --cached --quiet || (git commit -m "autopost: $(date -u +%F' '%H:%M) update" && git push)
