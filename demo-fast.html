<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MsgHealth Product Demo — Fast Cut</title>
<style>
  @font-face { font-family: 'Inter'; font-weight: 400; src: url(assets/fonts/inter-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 500; src: url(assets/fonts/inter-latin-500-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 600; src: url(assets/fonts/inter-latin-600-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 700; src: url(assets/fonts/inter-latin-700-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 800; src: url(assets/fonts/inter-latin-800-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 900; src: url(assets/fonts/inter-latin-900-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Instrument Serif'; font-style: italic; font-weight: 400; src: url(assets/fonts/instrument-serif-latin-400-italic.woff2) format('woff2'); }
  @font-face { font-family: 'Instrument Serif'; font-style: normal; font-weight: 400; src: url(assets/fonts/instrument-serif-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 400; src: url(assets/fonts/jetbrains-mono-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 500; src: url(assets/fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2'); }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 700; src: url(assets/fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2'); }
  :root { --bg: #0b0b14; --fg: #f2efe8; --muted: #9a98b8; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: Inter, system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; box-sizing: border-box; }
  canvas { width: min(100%, calc((100vh - 90px) * 16 / 9)); aspect-ratio: 16 / 9; display: block; border-radius: 6px; background: #000; }
  .bar { width: min(100%, calc((100vh - 90px) * 16 / 9)); display: flex; gap: 12px; align-items: center; }
  button { background: #1a1930; color: var(--fg); border: 1px solid #34317a; border-radius: 6px; padding: 6px 14px; font: 700 14px Inter, sans-serif; cursor: pointer; }
  input[type=range] { flex: 1; accent-color: #4f46e5; }
  #time { font: 700 13px Inter, sans-serif; color: var(--muted); min-width: 92px; text-align: right; }
  body.render { padding: 0; display: block; }
  body.render canvas { width: 1920px; height: 1080px; border-radius: 0; }
  body.render .bar { display: none; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div class="bar">
  <button id="play">Play</button>
  <input id="seek" type="range" min="0" max="1000" value="0">
  <span id="time">0.0s</span>
</div>
<script>window.FILM_DURATION = 20.5;</script>
<script src="src/brand.js"></script>
<script src="src/demo/engine.js"></script>
<script src="src/demo/scenes.js"></script>
<script src="src/demo/fast.js"></script>
<script src="src/demo/main.js"></script>
</body>
</html>
